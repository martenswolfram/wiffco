stages:
  - test

# Job: run pytest tests
pytest:
  stage: test
  image: python:3.11  # of 3.10, afhankelijk van jouw project
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt  # of pyproject.toml via poetry/pdm, als je dat gebruikt
  script:
    - pytest -v --maxfail=1 --disable-warnings --tb=short
  artifacts:
    when: always
    paths:
      - pytest-report.xml
    reports:
      junit: pytest-report.xml
